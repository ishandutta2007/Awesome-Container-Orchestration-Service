<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    
    /* Animations */
    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .floating-card-1 { animation: float 6s ease-in-out infinite; transform-origin: center; }
    .floating-card-2 { animation: float 8s ease-in-out infinite 1s; transform-origin: center; }
    .floating-card-3 { animation: float 7s ease-in-out infinite 2s; transform-origin: center; }
    .pulsing-bg { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
    .animated-line { stroke-dasharray: 8 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Background Animated Glowing Orbs -->
  <circle cx="200" cy="100" r="180" fill="#3b82f6" opacity="0.15" filter="url(#blurFilter)" class="pulsing-bg"/>
  <circle cx="1000" cy="300" r="200" fill="#8b5cf6" opacity="0.15" filter="url(#blurFilter)" class="pulsing-bg"/>

  <!-- Background Tech Mesh Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350" />
    <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400 M 600,0 L 600,400 M 700,0 L 700,400 M 800,0 L 800,400 M 900,0 L 900,400 M 1000,0 L 1000,400 M 1100,0 L 1100,400" />
  </g>

  <!-- Background Animated Flow Lines (Behind text layer) -->
  <g stroke="#38bdf8" opacity="0.3" stroke-width="2" fill="none">
    <path d="M 100,320 Q 300,380 500,320 T 900,320" class="animated-line" />
    <path d="M 200,80 Q 500,20 800,80 T 1100,80" class="animated-line" stroke="#c084fc" />
  </g>

  <!-- Background Floating Decorative Pod / Container Cards (Right Side & Edges, low opacity) -->
  <g class="floating-card-1" opacity="0.4">
    <rect x="920" y="60" width="180" height="90" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="940" y="95" font-family="sans-serif" font-size="14" fill="#38bdf8" font-weight="bold">☸️ Kubernetes</text>
    <text x="940" y="120" font-family="sans-serif" font-size="12" fill="#64748b">Status: Running</text>
    <circle cx="1070" cy="90" r="6" fill="#22c55e"/>
  </g>

  <g class="floating-card-2" opacity="0.4">
    <rect x="850" y="230" width="190" height="95" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="870" y="265" font-family="sans-serif" font-size="14" fill="#818cf8" font-weight="bold">🏕️ HashiCorp Nomad</text>
    <text x="870" y="290" font-family="sans-serif" font-size="12" fill="#64748b">Jobs: 100% Healthy</text>
    <circle cx="1015" cy="260" r="6" fill="#22c55e"/>
  </g>

  <g class="floating-card-3" opacity="0.3">
    <rect x="70" y="240" width="160" height="80" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="90" y="270" font-family="sans-serif" font-size="14" fill="#c084fc" font-weight="bold">🍓 K3s Cluster</text>
    <text x="90" y="295" font-family="sans-serif" font-size="12" fill="#64748b">Nodes: Edge-01</text>
    <circle cx="205" cy="265" r="6" fill="#22c55e"/>
  </g>

  <!-- FOREGROUND CONTENT CONTAINER (Centered & Clean) -->
  <g transform="translate(100, 110)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="340" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="16" y="22" class="badge-text">⚡ CURATED CONTAINER ECOSYSTEM 2026</text>

    <!-- Main Title -->
    <text x="0" y="85" class="title" filter="url(#glow)">
      Awesome Container Orchestration
    </text>

    <!-- Subtitle -->
    <text x="0" y="130" class="subtitle">
      Kubernetes • Managed Cloud Services • Open-Source Schedulers • Edge Computing
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="120" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="12" y="18" font-family="sans-serif" font-size="12" fill="#cbd5e1">☁️ EKS / GKE / AKS</text>

      <rect x="132" y="0" width="110" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="144" y="18" font-family="sans-serif" font-size="12" fill="#cbd5e1">🍓 K3s / K0s</text>

      <rect x="254" y="0" width="120" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="266" y="18" font-family="sans-serif" font-size="12" fill="#cbd5e1">🏕️ Nomad / Swarm</text>

      <rect x="386" y="0" width="110" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="398" y="18" font-family="sans-serif" font-size="12" fill="#cbd5e1">💧 PaaS / Coolify</text>
    </g>
  </g>
</svg>
